name: Run Unit Tests

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate AI catalog and generate llms.txt
        run: npm run generate:ai

      - name: Run tests
        run: npm test -- --run

      - name: Build package
        run: npm run build
